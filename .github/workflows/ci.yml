name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test
      - name: self-scan the malicious fixture
        run: node bin/skill-audit.js test/fixtures/malicious-skill --format sarif | head -3

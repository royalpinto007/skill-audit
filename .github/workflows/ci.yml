name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests
        run: node --test
      - name: Clean fixture must pass the gate (exit 0)
        run: node bin/skill-audit.js test/fixtures/clean-skill --fail-on high
      - name: Malicious fixture must be flagged (exit 1)
        run: |
          if node bin/skill-audit.js test/fixtures/malicious-skill --fail-on high; then
            echo "::error::malicious fixture was NOT flagged"; exit 1
          else
            echo "OK: malicious fixture correctly flagged"
          fi
      - name: SARIF output is produced
        run: node bin/skill-audit.js test/fixtures/malicious-skill --format sarif | head -5
